<!DOCTYPE html>
<html lang="en">
<head>
    <!--all the meta data will called in with a template-->
    <link rel="stylesheet" href="./css/style.css">
    <!--defer = wait until  the whole page is rendered before running the script-->
    <!--order MATTERS: the component must be called before the main.js-->
    <script src="./js/component.js" defer></script>
    <script src="./js/main.js" defer></script>
</head>

<body data-page="about">

  <header id="site-header"></header>

  <main>
    <section class="page-intro">
      <h1>About us</h1>
      <p>Bright Bean started as a single espresso cart. Today we roast our ownbeans, bake fresh every morning, and know most of our customers by name.</p>
      <p>We believe a good coffee is simple: great beans, careful brewing, and a friendly hello.</p>
    </section>

    <section id="cta" class="cta"></section>
  </main>

  <footer id="site-footer"></footer>

</body>
</html>
